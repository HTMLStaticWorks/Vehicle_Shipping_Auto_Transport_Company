<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070d18" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="routeLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base with Grid -->
  <rect width="1000" height="600" rx="16" fill="url(#bgGrad)"/>
  <rect width="1000" height="600" rx="16" fill="url(#grid)"/>

  <!-- Stylized USA Map Silhouette Path -->
  <path d="M 120 160 L 220 155 L 290 180 L 380 185 L 450 170 L 530 170 L 590 190 L 670 170 L 730 150 L 800 130 L 870 140 L 910 165 L 890 220 L 840 250 L 850 320 L 890 380 L 860 440 L 820 480 L 790 530 L 760 480 L 710 470 L 650 490 L 560 480 L 510 540 L 460 550 L 410 490 L 350 480 L 280 470 L 210 460 L 160 420 L 110 330 L 115 240 Z" 
        fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Secondary Interior Regions -->
  <path d="M 230 160 L 280 320 L 310 470" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <path d="M 470 170 L 480 340 L 460 550" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <path d="M 680 175 L 680 350 L 650 490" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Major Shipping Corridors (Highways: I-80, I-10, I-95, I-35, I-5) -->
  <!-- Transcontinental North (Seattle to New York) -->
  <path d="M 170 180 Q 320 210, 520 220 T 840 210" fill="none" stroke="url(#routeLine)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Transcontinental South (LA to Miami) -->
  <path d="M 160 390 Q 380 460, 530 460 T 810 510" fill="none" stroke="url(#routeLine)" stroke-width="3.5" filter="url(#glow)"/>

  <!-- Central Crossing (San Francisco to Atlanta / DC) -->
  <path d="M 140 280 Q 360 300, 530 330 T 820 290" fill="none" stroke="url(#accentLine)" stroke-width="2.5" stroke-dasharray="6 3"/>

  <!-- North-South Central Corridor (Chicago to Dallas / Houston) -->
  <path d="M 590 230 L 520 340 L 510 480" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 4"/>

  <!-- East Coast Corridor (Boston to Miami) -->
  <path d="M 870 170 L 840 260 L 800 380 L 810 510" fill="none" stroke="#f97316" stroke-width="2.5"/>

  <!-- West Coast Corridor (Seattle to San Diego) -->
  <path d="M 170 180 L 140 280 L 160 390 L 190 440" fill="none" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Major Logistics Hub Pins -->
  <!-- 1. Seattle / Pacific NW -->
  <g transform="translate(170, 180)">
    <circle r="14" fill="#2563eb" fill-opacity="0.25"/>
    <circle r="6" fill="#38bdf8"/>
    <text x="12" y="4" fill="#e2e8f0" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600">Seattle Hub</text>
  </g>

  <!-- 2. San Francisco / Bay Area -->
  <g transform="translate(140, 280)">
    <circle r="12" fill="#2563eb" fill-opacity="0.2"/>
    <circle r="5" fill="#38bdf8"/>
    <text x="12" y="4" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="11">Bay Area Terminal</text>
  </g>

  <!-- 3. Los Angeles (Major Metro Hub) -->
  <g transform="translate(160, 390)">
    <circle r="18" fill="#f97316" fill-opacity="0.3"/>
    <circle r="8" fill="#f97316" filter="url(#glow)"/>
    <circle r="3" fill="#ffffff"/>
    <text x="14" y="4" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Los Angeles Terminal</text>
    <text x="14" y="18" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Active Carriers: 84</text>
  </g>

  <!-- 4. Denver -->
  <g transform="translate(370, 290)">
    <circle r="12" fill="#2563eb" fill-opacity="0.2"/>
    <circle r="5" fill="#38bdf8"/>
    <text x="10" y="4" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="11">Denver Staging</text>
  </g>

  <!-- 5. Dallas / Fort Worth (Central Super-Hub) -->
  <g transform="translate(520, 420)">
    <circle r="20" fill="#2563eb" fill-opacity="0.35"/>
    <circle r="9" fill="#3b82f6" filter="url(#glow)"/>
    <circle r="4" fill="#ffffff"/>
    <text x="16" y="2" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Dallas Super-Hub</text>
    <text x="16" y="16" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Cross-Country Transit Center</text>
  </g>

  <!-- 6. Chicago / Great Lakes -->
  <g transform="translate(620, 240)">
    <circle r="16" fill="#2563eb" fill-opacity="0.3"/>
    <circle r="7" fill="#38bdf8"/>
    <circle r="3" fill="#ffffff"/>
    <text x="14" y="2" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Chicago Terminal</text>
    <text x="14" y="16" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Midwest Distribution</text>
  </g>

  <!-- 7. Atlanta / Southeast Hub -->
  <g transform="translate(710, 390)">
    <circle r="16" fill="#2563eb" fill-opacity="0.3"/>
    <circle r="7" fill="#38bdf8"/>
    <circle r="3" fill="#ffffff"/>
    <text x="14" y="4" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600">Atlanta Logistics Hub</text>
  </g>

  <!-- 8. New York / New Jersey Metro -->
  <g transform="translate(840, 220)">
    <circle r="18" fill="#f97316" fill-opacity="0.3"/>
    <circle r="8" fill="#f97316" filter="url(#glow)"/>
    <circle r="3" fill="#ffffff"/>
    <text x="-120" y="2" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">NY/NJ Metro Hub</text>
    <text x="-120" y="16" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Northeast Corridor Hub</text>
  </g>

  <!-- 9. Miami / South Florida -->
  <g transform="translate(810, 520)">
    <circle r="14" fill="#2563eb" fill-opacity="0.25"/>
    <circle r="6" fill="#38bdf8"/>
    <text x="-95" y="4" fill="#e2e8f0" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600">Miami Terminal</text>
  </g>

  <!-- Live In-Transit Shipment Indicators (Simulated) -->
  <g transform="translate(340, 360)">
    <rect x="-8" y="-8" width="16" height="16" rx="4" fill="#f97316"/>
    <circle r="3" fill="#ffffff"/>
    <rect x="14" y="-12" width="125" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="22" y="4" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="10" font-weight="600">RL-2026-04821 • In Transit</text>
  </g>

  <!-- Map Legend / Stats Card Overlay -->
  <g transform="translate(30, 480)">
    <rect width="260" height="90" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="24" r="5" fill="#f97316"/>
    <text x="34" y="28" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Primary Super-Hub Terminals</text>
    
    <circle cx="20" cy="46" r="5" fill="#38bdf8"/>
    <text x="34" y="50" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Regional Staging Hubs</text>

    <line x1="15" y1="68" x2="30" y2="68" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="34" y="72" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Active Interstate Transit Corridors</text>
  </g>

  <!-- Timestamp & Coverage Badge -->
  <g transform="translate(760, 30)">
    <rect width="210" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="17" r="4" fill="#22c55e"/>
    <text x="32" y="21" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">50 STATES COVERED • 24/7 DISPATCH</text>
  </g>
</svg>
